<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Escale — suivi d'escales portuaires</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      :root { --encre:#1a2027; --vert:#2e9e5b; }
      * { box-sizing:border-box; }
      body { margin:0; font:15px/1.5 system-ui,sans-serif; color:var(--encre); }
      header { padding:14px 20px; border-bottom:1px solid #e2e6ea; display:flex;
               align-items:baseline; gap:14px; }
      h1 { font-size:18px; margin:0; }
      .etat { font-size:13px; color:#6b7684; }
      main { display:grid; grid-template-columns:1fr 340px; height:calc(100vh - 53px); }
      #carte { height:100%; }
      aside { border-left:1px solid #e2e6ea; overflow:auto; }
      table { width:100%; border-collapse:collapse; font-size:13px; }
      th { text-align:left; padding:8px 12px; background:#f4f5f7; font-weight:600; }
      td { padding:8px 12px; border-bottom:1px solid #eef1f4; }
      .eta { font-variant-numeric:tabular-nums; color:var(--vert); font-weight:600; }
    </style>
  </head>
  <body>
    <header>
      <h1>Escale</h1>
      <span class="etat" id="etat">connexion…</span>
    </header>
    <main>
      <div id="carte"></div>
      <aside>
        <table>
          <thead><tr><th>Navire</th><th>Port</th><th>ETA</th></tr></thead>
          <tbody id="liste"></tbody>
        </table>
      </aside>
    </main>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
