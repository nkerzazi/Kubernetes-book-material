# Chapitre 7 — les Secrets ne sont PAS chiffres par defaut, seulement encodes.
# Ce fichier est un gabarit : il ne doit jamais contenir de vraie valeur, et
# ne doit jamais etre versionne rempli. Le ch. 11 traite des vraies reponses
# (chiffrement au repos, External Secrets, SOPS, Vault).
apiVersion: v1
kind: Secret
metadata:
  name: escale-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: "a-remplacer"
  DATABASE_URL: "postgresql://postgres:a-remplacer@postgres:5432/escale"
