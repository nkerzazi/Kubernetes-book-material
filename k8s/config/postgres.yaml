# Chapitre 7 — une base de donnees a une identite et un disque : StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None            # Service "headless" : identite stable par Pod
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_DB
              value: escale
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: escale-secrets, key: POSTGRES_PASSWORD }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: donnees
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata: { name: donnees }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 2Gi }
